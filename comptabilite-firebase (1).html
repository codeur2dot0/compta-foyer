function ChartCanvas({ type, data, options }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const depKey = JSON.stringify(data) + "|" + JSON.stringify(options) + "|" + type;
  useEffect(() => {
    if (!canvasRef.current || typeof Chart === "undefined") return;
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current.getContext("2d"), { type, data, options });
    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [depKey]);
  return <canvas ref={canvasRef} />;
}

function chartOptions(currency) {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label ? ctx.dataset.label + ": " : ""}${money(ctx.parsed.y, currency)}` } },
    },
    scales: {
      x: { ticks: { font: { size: 9 }, color: C.muted }, grid: { display: false } },
      y: { display: false },
    },
  };
}

  const list = kind === "revenu" ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
  for (const c of list) {

      if (s) return { id: s.id, label: `${c.label} · ${s.label}`, icon: c.icon, color: c.color, flowType: s.flowType || "depense" };

  }
  const fb = list[list.length - 1];
  return { id: fb.id, label: fb.label, icon: fb.icon, color: fb.color, flowType: fb.flowType || "depense" };
};

function Ring({ pct, color, size = 56, stroke = 6 }) {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(100, pct));
  return (
    <svg width={size} height={size} style={{ transform: "rotate(-90deg)", flexShrink: 0 }}>
      <circle cx={size / 2} cy={size / 2} r={r} stroke={C.border} strokeWidth={stroke} fill="none" />
      <circle
        cx={size / 2} cy={size / 2} r={r} stroke={color} strokeWidth={stroke} fill="none"
        strokeDasharray={circ} strokeDashoffset={circ - (circ * clamped) / 100}
        strokeLinecap="round"
        style={{ transition: "stroke-dashoffset 0.5s ease" }}
      />
    </svg>
  );
}

          color: C.gold, background: "none", border: "none", padding: "4px 2px",
        }}>
          <Plus size={14} strokeWidth={2.5} /> {addLabel || "Ajouter"}
        </button>
      )}
    </div>
  );
}

function Empty({ text }) {
  return (
    <p className="gl-sans" style={{ fontSize: 13, color: C.muted, padding: "14px 0", margin: 0, lineHeight: 1.5 }}>
      {text}
    </p>
  );
}

function CategoryPicker({ list, group, category, onSelect, allowWholeCategory }) {
  const groupObj = list.find((c) => c.id === group) || list[0];
  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8 }}>
        {list.map((c) => {
          const Icon = c.icon;
          const sel = group === c.id;
          return (
            <button
              key={c.id}
              onClick={() => onSelect(c.id, allowWholeCategory ? c.id : (c.subcategories ? c.subcategories[0].id : c.id))}
              className="gl-sans"
              style={{
                display: "flex", flexDirection: "column", alignItems: "center", gap: 5, padding: "10px 4px",
                borderRadius: 12, border: `1px solid ${sel ? c.color : C.border}`, background: sel ? c.color + "20" : C.card,
              }}
            >
              <Icon size={16} color={c.color} />
              <span style={{ fontSize: 10.5, fontWeight: 600, color: C.inkSoft }}>{c.label}</span>
            </button>
          );
        })}
      </div>
      {groupObj.subcategories && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}>
          {allowWholeCategory && (
            <button
              onClick={() => onSelect(group, groupObj.id)}
              className="gl-sans"
              style={{
                padding: "7px 12px", borderRadius: 20, fontSize: 12, fontWeight: 700,
                border: `1px solid ${category === groupObj.id ? groupObj.color : C.border}`, background: category === groupObj.id ? groupObj.color + "20" : C.card, color: C.inkSoft,
              }}
            >
              Toute la catégorie
            </button>
          )}
          {groupObj.subcategories.map((s) => {
            const sel = category === s.id;
            return (
              <button
                key={s.id}
                onClick={() => onSelect(group, s.id)}
                className="gl-sans"
                style={{
                  padding: "7px 12px", borderRadius: 20, fontSize: 12, fontWeight: 600,
                  border: `1px solid ${sel ? groupObj.color : C.border}`, background: sel ? groupObj.color + "20" : C.card, color: C.inkSoft,
                }}
              >
                {s.label}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

try {

function App() {
  const [ready, setReady] = useState(false);
  const [settings, setSettings] = useState({ person1: "Personne 1", person2: "Personne 2", foyerName: "Notre foyer", currency: "EUR", pins: {} });
  const [transactions, setTransactions] = useState([]);
  const [budgets, setBudgets] = useState([]);
  const [goals, setGoals] = useState([]);
  const [recurring, setRecurring] = useState([]);
  const [tab, setTab] = useState("foyer");
  const [month, setMonth] = useState(todayYM());
  const [view, setView] = useState("main"); // 'main' | 'year-select' | 'year-detail' | 'patrimoine-detail'
  const [selectedYear, setSelectedYear] = useState(null);
  const [selectedPatrimoineId, setSelectedPatrimoineId] = useState(null);
  const [placements, setPlacements] = useState([]);
  const [debts, setDebts] = useState([]);
  const [patrimoine, setPatrimoine] = useState([]);
  const [patrimoineEntries, setPatrimoineEntries] = useState([]);
  const [modal, setModal] = useState(null);
  const [draft, setDraft] = useState({});
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [unlocked, setUnlocked] = useState({ person1: false, person2: false });
  const [pinValue, setPinValue] = useState("");
  const [pinError, setPinError] = useState(false);
  const [confirmRemovePin, setConfirmRemovePin] = useState(false);
  const [formError, setFormError] = useState("");

  useEffect(() => {
    setPinValue("");
    setPinError(false);
    setConfirmRemovePin(false);
    setView("main");
    setSelectedYear(null);
  }, [tab]);

  const colRef = useRef(null);

  useEffect(() => {
    let unsubs = [];
    (async () => {
      if (!FIREBASE_READY) { setReady(true); return; } // config Firebase pas encore renseignée : l'appli reste utilisable en mémoire, sans sauvegarde.
      try { await fbAuth.signInAnonymously(); } catch (e) { console.error("Connexion Firebase impossible", e); setReady(true); return; }
      const col = fbDb.collection("householdData");
      colRef.current = col;
      const docIds = ["settings", "transactions", "budgets", "goals", "recurring", "placements", "debts", "patrimoine", "patrimoine_entries"];
      const snaps = await Promise.all(docIds.map((id) => col.doc(id).get().catch(() => null)));
      const [s, t, b, g, r, pl, dt, pat, pate] = snaps;
      if (s?.exists) setSettings(s.data());
      if (t?.exists) setTransactions((t.data().items || []).map((x) => ({ ...x, category: migrateCategory(x.category) })));
      if (b?.exists) setBudgets((b.data().items || []).map((x) => ({ ...x, category: migrateCategory(x.category) })));
      if (g?.exists) setGoals(g.data().items || []);
      if (r?.exists) setRecurring((r.data().items || []).map((x) => ({ ...x, category: migrateCategory(x.category) })));
      if (pl?.exists) setPlacements(pl.data().items || []);
      if (dt?.exists) setDebts((dt.data().items || []).map((x) => ({ ...x, category: migrateCategory(x.category) })));
      if (pat?.exists) setPatrimoine(pat.data().items || []);
      if (pate?.exists) setPatrimoineEntries(pate.data().items || []);
      setReady(true);

      // écoute en direct : si votre compagne modifie quelque chose sur son téléphone, ça apparaît ici automatiquement.
      const bindLive = (id, setter, migrate) => col.doc(id).onSnapshot((snap) => {
        if (!snap.exists) return;
        const data = snap.data();
        const value = data.items !== undefined ? data.items : data;
        setter(migrate ? value.map((x) => ({ ...x, category: migrateCategory(x.category) })) : value);
      }, (e) => console.error("Sync error:", id, e));
      unsubs = [
        bindLive("settings", setSettings, false),
        bindLive("transactions", setTransactions, true),
        bindLive("budgets", setBudgets, true),
        bindLive("goals", setGoals, false),
        bindLive("recurring", setRecurring, true),
        bindLive("placements", setPlacements, false),
        bindLive("debts", setDebts, true),
        bindLive("patrimoine", setPatrimoine, false),
        bindLive("patrimoine_entries", setPatrimoineEntries, false),
      ];
    })();
    return () => unsubs.forEach((u) => u && u());
  }, []);

  // Chaque catégorie de données est un seul document JSON dans Firestore ;
  // les tableaux sont enveloppés dans { items: [...] } car un document Firestore est un objet.
  // Le passage JSON.stringify/parse retire automatiquement les valeurs "undefined" (ex. un champ
  // optionnel non renseigné), que Firestore refuse silencieusement sinon.
  async function persist(id, value, setter, isArray) {
    setter(value);
    if (!colRef.current) return;
    try {
      const clean = JSON.parse(JSON.stringify(isArray ? { items: value } : value));
      await colRef.current.doc(id).set(clean);
    } catch (e) { console.error(e); }
  }
  const saveSettings = (v) => persist("settings", v, setSettings, false);
  const saveTx = (v) => persist("transactions", v, setTransactions, true);
  const saveBudgets = (v) => persist("budgets", v, setBudgets, true);
  const saveGoals = (v) => persist("goals", v, setGoals, true);
  const saveRecurring = (v) => persist("recurring", v, setRecurring, true);
  const savePlacements = (v) => persist("placements", v, setPlacements, true);
  const saveDebts = (v) => persist("debts", v, setDebts, true);
  const savePatrimoine = (v) => persist("patrimoine", v, setPatrimoine, true);
  const savePatrimoineEntries = (v) => persist("patrimoine_entries", v, setPatrimoineEntries, true);

  const scopeName = (scope) => (scope === "foyer" ? settings.foyerName : scope === "patrimoine" ? "Projets" : scope === "person1" ? settings.person1 : settings.person2);
  const scopeColor = (scope) => C[scope];

  /* ---- derived ---- */
  const txThisMonth = useMemo(() => transactions.filter((t) => inMonth(t.date, month)), [transactions, month]);
  // Chaque espace (foyer, personne 1, personne 2) est un compte indépendant :
  // aucune agrégation entre eux, même sur l'onglet Foyer.
  const txForTab = useMemo(() => txThisMonth.filter((t) => t.person === tab), [txThisMonth, tab]);
  const totals = useMemo(() => {
    const rev = txForTab.filter((t) => t.kind === "revenu" && t.category !== "epargne").reduce((a, t) => a + t.amount, 0);
    const dep = txForTab.filter((t) => t.kind === "depense" && t.category !== "epargne").reduce((a, t) => a + t.amount, 0);
    const epargne =
      txForTab.filter((t) => t.category === "epargne" && t.kind === "depense").reduce((a, t) => a + t.amount, 0) -
      txForTab.filter((t) => t.category === "epargne" && t.kind === "revenu").reduce((a, t) => a + t.amount, 0);
    return { rev, dep, epargne, solde: rev - dep };
  }, [txForTab]);
  // Solde cumulé : report de l'argent restant d'un mois sur l'autre (comme un vrai solde de compte),
  // contrairement à Revenus/Dépenses ci-dessous qui restent strictement ceux du mois affiché.
  const soldeCumule = useMemo(
    () =>
      transactions
        .filter((t) => t.person === tab && t.date.slice(0, 7) <= month)
        .reduce((a, t) => a + (t.kind === "revenu" ? t.amount : -t.amount), 0),
    [transactions, tab, month]
  );
  const recurringMonthlyTotal = useMemo(() => {
    const list = recurring.filter((r) => r.scope === tab);
    const dep = list.filter((r) => r.kind === "depense").reduce((a, r) => a + r.amount, 0);
    const rev = list.filter((r) => r.kind === "revenu").reduce((a, r) => a + r.amount, 0);
    return dep - rev;
  }, [recurring, tab]);
  const lockedNow = tab !== "foyer" && tab !== "patrimoine" && !!(settings.pins && settings.pins[tab]) && !unlocked[tab];

  // Résumé annuel : page dédiée par espace, menu des années à partir de 2026.
  const YEARS = useMemo(() => {
    const start = 2026;
    const end = Math.max(start, new Date().getFullYear());
    const arr = [];
    for (let y = end; y >= start; y--) arr.push(y);
    return arr;
  }, []);
  const yearData = useMemo(() => {
    const y = selectedYear || YEARS[0];
    const txY = transactions.filter((t) => t.person === tab && t.date.slice(0, 4) === String(y));
    let cumulEpargne = 0;
    const monthly = MONTH_SHORT.map((label, idx) => {
      const mm = String(idx + 1).padStart(2, "0");
      const list = txY.filter((t) => t.date.slice(5, 7) === mm);
      const epargneMois =
        list.filter((t) => t.category === "epargne" && t.kind === "depense").reduce((a, t) => a + t.amount, 0) -
        list.filter((t) => t.category === "epargne" && t.kind === "revenu").reduce((a, t) => a + t.amount, 0);
      cumulEpargne += epargneMois;
      return {
        label,
        Revenus: list.filter((t) => t.kind === "revenu" && t.category !== "epargne").reduce((a, t) => a + t.amount, 0),
        Charges: list.filter((t) => t.kind === "depense" && t.category !== "epargne" && catInfo(t.category, "depense").flowType === "charge").reduce((a, t) => a + t.amount, 0),
        Dépenses: list.filter((t) => t.kind === "depense" && t.category !== "epargne" && catInfo(t.category, "depense").flowType !== "charge").reduce((a, t) => a + t.amount, 0),
        Épargne: epargneMois,
        Solde: list.filter((t) => t.kind === "revenu").reduce((a, t) => a + t.amount, 0) - list.filter((t) => t.kind === "depense").reduce((a, t) => a + t.amount, 0),
        "Épargne cumulée": cumulEpargne,
      };
    });
    const totals = monthly.reduce(
      (acc, m) => ({ rev: acc.rev + m.Revenus, charges: acc.charges + m.Charges, dep: acc.dep + m.Dépenses, sav: acc.sav + m.Épargne }),
      { rev: 0, charges: 0, dep: 0, sav: 0 }
    );
    const catTotals = {};
    txY.filter((t) => t.kind === "depense" && t.category !== "epargne").forEach((t) => {
      const top = EXPENSE_CATEGORIES.find((c) => c.id === t.category || (c.subcategories && c.subcategories.some((s) => s.id === t.category)));
      const key = top ? top.id : "autres_depense";
      if (!catTotals[key]) catTotals[key] = { name: top ? top.label : "Autres", value: 0, color: top ? top.color : C.muted };
      catTotals[key].value += t.amount;
    });
    const categoryBreakdown = Object.values(catTotals).sort((a, b) => b.value - a.value);
    return { monthly, totals, categoryBreakdown, hasData: txY.length > 0 };
  }, [transactions, tab, selectedYear, YEARS]);

  function tryUnlock() {
    if (pinValue && settings.pins && pinValue === settings.pins[tab]) {
      setUnlocked({ ...unlocked, [tab]: true });
      setPinValue("");
      setPinError(false);
    } else {
      setPinError(true);
    }
  }

  const budgetsForTab = budgets.filter((b) => b.scope === tab);
  const goalsForTab = goals.filter((g) => g.scope === tab);
  const recurringForTab = recurring.filter((r) => r.scope === tab);
  const placementsForTab = placements.filter((p) => p.scope === tab);
  const debtsForTab = debts.filter((d) => d.scope === tab);
  const recentTx = [...txForTab].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 25);

  const spentFor = (scope, category) => {
    const groupObj = EXPENSE_CATEGORIES.find((c) => c.id === category);
    const matchIds = groupObj && groupObj.subcategories ? [groupObj.id, ...groupObj.subcategories.map((s) => s.id)] : [category];
    return txThisMonth.filter((t) => t.person === scope && t.kind === "depense" && matchIds.includes(t.category)).reduce((a, t) => a + t.amount, 0);
  };

  /* ---- modal handling ---- */
  function openModal(type, extra = {}) {
    const baseScope = extra.scope || tab;
    const defExpense = firstCat(EXPENSE_CATEGORIES);
    let d = {};
    if (type === "transaction") d = { kind: "depense", amount: "", scope: baseScope, catGroup: defExpense.group, category: defExpense.category, date: todayISO(), note: "", debtId: "" };
    if (type === "budget") d = { scope: baseScope, catGroup: defExpense.group, category: defExpense.category, limit: "" };
    if (type === "goal") d = { scope: baseScope, name: "", target: "", deadline: "" };
    if (type === "goal-add") d = { goalId: extra.goalId, amount: "" };
    if (type === "recurring") d = { scope: baseScope, name: "", amount: "", kind: "depense", catGroup: defExpense.group, category: defExpense.category, day: "1", debtId: "" };
    if (type === "settings") d = { ...settings };
    if (type === "set-pin") d = { newPin: "", confirmPin: "" };
    if (type === "placement") d = { scope: baseScope, name: "", initialBalance: "", goalId: "" };
    if (type === "placement-move") d = { placementId: extra.placementId, direction: extra.direction || "verser", amount: "" };
    if (type === "debt") { const dc = firstCat(BUDGET_EXPENSE_CATEGORIES); d = { scope: baseScope, name: "", principal: "", remaining: "", catGroup: dc.group, category: dc.category }; }
    if (type === "debt-pay") d = { debtId: extra.debtId, amount: "" };
    if (type === "patrimoine-project") d = { name: "", target: "" };
    if (type === "patrimoine-entry") {
      const existing = patrimoineEntries.find((e) => e.projectId === selectedPatrimoineId && e.month === (extra.month || todayYM()));
      d = { projectId: selectedPatrimoineId, month: extra.month || todayYM(), person1: existing ? String(existing.person1) : "", person2: existing ? String(existing.person2) : "" };
    }
    setDraft(d);
    setFormError("");
    setModal({ type });
  }
  const closeModal = () => { setModal(null); setDraft({}); setFormError(""); };

  function submitModal() {
    if (modal.type === "transaction") {
      const amt = parseFloat(String(draft.amount).replace(",", "."));
      if (!amt || amt <= 0) return setFormError("Indiquez un montant valide.");
      if (!draft.category) return setFormError("Choisissez une catégorie.");
      let linkedDebt = null;
      if (draft.debtId) {
        linkedDebt = debts.find((d) => d.id === draft.debtId);
        if (linkedDebt && amt > linkedDebt.remaining) return setFormError("Ce montant dépasse le capital restant dû de la dette liée.");
      }
      saveTx([...transactions, {
        id: uid(), person: draft.scope, kind: draft.kind, amount: amt, category: draft.category, date: draft.date || todayISO(), note: draft.note?.trim() || "",
        debtId: linkedDebt ? linkedDebt.id : undefined,
      }]);
      if (linkedDebt) saveDebts(debts.map((d) => (d.id === linkedDebt.id ? { ...d, remaining: d.remaining - amt } : d)));
    }
    if (modal.type === "budget") {
      const lim = parseFloat(String(draft.limit).replace(",", "."));
      if (!lim || lim <= 0) return setFormError("Indiquez une limite mensuelle valide.");
      const filtered = budgets.filter((b) => !(b.scope === draft.scope && b.category === draft.category));
      saveBudgets([...filtered, { id: uid(), scope: draft.scope, category: draft.category, limit: lim }]);
    }
    if (modal.type === "goal") {
      const target = parseFloat(String(draft.target).replace(",", "."));
      if (!draft.name.trim()) return setFormError("Donnez un nom à cet objectif.");
      if (!target || target <= 0) return setFormError("Indiquez un montant visé valide.");
      saveGoals([...goals, { id: uid(), scope: draft.scope, name: draft.name.trim(), target, current: 0, deadline: draft.deadline || "" }]);
    }
    if (modal.type === "goal-add") {
      const amt = parseFloat(String(draft.amount).replace(",", "."));
      if (!amt || amt <= 0) return setFormError("Indiquez un montant valide.");
      saveGoals(goals.map((g) => (g.id === draft.goalId ? { ...g, current: g.current + amt } : g)));
    }
    if (modal.type === "recurring") {
      const amt = parseFloat(String(draft.amount).replace(",", "."));
      const day = parseInt(draft.day, 10);
      if (!draft.name.trim()) return setFormError("Donnez un nom à cette charge (ex. Loyer, Netflix).");
      if (!amt || amt <= 0) return setFormError("Indiquez un montant valide.");
      if (!day || day < 1 || day > 28) return setFormError("Le jour du mois doit être compris entre 1 et 28.");
      saveRecurring([...recurring, { id: uid(), scope: draft.scope, name: draft.name.trim(), amount: amt, kind: draft.kind, category: draft.category, day, debtId: draft.debtId || undefined }]);
    }
    if (modal.type === "settings") {
      saveSettings({ ...settings, person1: draft.person1.trim() || "Personne 1", person2: draft.person2.trim() || "Personne 2", foyerName: draft.foyerName.trim() || "Notre foyer", currency: draft.currency });
    }
    if (modal.type === "set-pin") {
      const p1 = String(draft.newPin).trim();
      const p2 = String(draft.confirmPin).trim();
      if (!/^\d{4,6}$/.test(p1)) return setFormError("Le code doit contenir 4 à 6 chiffres.");
      if (p1 !== p2) return setFormError("Les deux codes ne correspondent pas.");
      const pins = { ...(settings.pins || {}), [tab]: p1 };
      saveSettings({ ...settings, pins });
      setUnlocked({ ...unlocked, [tab]: true });
    }
    if (modal.type === "placement") {
      if (!draft.name.trim()) return setFormError("Donnez un nom à ce placement.");
      const initial = parseFloat(String(draft.initialBalance).replace(",", ".")) || 0;
      savePlacements([...placements, { id: uid(), scope: draft.scope, name: draft.name.trim(), balance: initial, goalId: draft.goalId || null }]);
    }
    if (modal.type === "placement-move") {
      const amt = parseFloat(String(draft.amount).replace(",", "."));
      const placement = placements.find((p) => p.id === draft.placementId);
      if (!placement || !amt || amt <= 0) return setFormError("Indiquez un montant valide.");
      if (draft.direction === "retirer" && amt > placement.balance) return setFormError("Le solde du placement est insuffisant.");
      const delta = draft.direction === "verser" ? amt : -amt;
      savePlacements(placements.map((p) => (p.id === placement.id ? { ...p, balance: p.balance + delta } : p)));
      saveTx([...transactions, {
        id: uid(), person: placement.scope,
        kind: draft.direction === "verser" ? "depense" : "revenu",
        amount: amt, category: "epargne", date: todayISO(),
        note: `${draft.direction === "verser" ? "Versement" : "Retrait"} : ${placement.name}`,
        placementId: placement.id,
      }]);
    }
    if (modal.type === "debt") {
      const principal = parseFloat(String(draft.principal).replace(",", "."));
      if (!draft.name.trim()) return setFormError("Donnez un nom à cette dette (ex. Prêt voiture).");
      if (!principal || principal <= 0) return setFormError("Indiquez le montant emprunté.");
      const remainingRaw = String(draft.remaining).trim();
      const remaining = remainingRaw ? parseFloat(remainingRaw.replace(",", ".")) : principal;
      saveDebts([...debts, { id: uid(), scope: draft.scope, name: draft.name.trim(), principal, remaining: Math.min(remaining, principal), category: draft.category }]);
    }
    if (modal.type === "debt-pay") {
      const amt = parseFloat(String(draft.amount).replace(",", "."));
      const debt = debts.find((d) => d.id === draft.debtId);
      if (!debt || !amt || amt <= 0) return setFormError("Indiquez un montant valide.");
      if (amt > debt.remaining) return setFormError("Ce montant dépasse le capital restant dû.");
      saveDebts(debts.map((d) => (d.id === debt.id ? { ...d, remaining: d.remaining - amt } : d)));
      saveTx([...transactions, {
        id: uid(), person: debt.scope, kind: "depense", amount: amt, category: debt.category, date: todayISO(),
        note: `Remboursement : ${debt.name}`, debtId: debt.id,
      }]);
    }
    if (modal.type === "patrimoine-project") {
      if (!draft.name.trim()) return setFormError("Donnez un nom à ce projet.");
      const target = String(draft.target).trim() ? parseFloat(String(draft.target).replace(",", ".")) : null;
      savePatrimoine([...patrimoine, { id: uid(), name: draft.name.trim(), target: target && target > 0 ? target : null }]);
    }
    if (modal.type === "patrimoine-entry") {
      const p1 = parseFloat(String(draft.person1).replace(",", ".")) || 0;
      const p2 = parseFloat(String(draft.person2).replace(",", ".")) || 0;
      if (!draft.month) return setFormError("Choisissez un mois.");
      const filtered = patrimoineEntries.filter((e) => !(e.projectId === draft.projectId && e.month === draft.month));
      savePatrimoineEntries([...filtered, { id: uid(), projectId: draft.projectId, month: draft.month, person1: p1, person2: p2 }]);
    }
    closeModal();
  }

  function toggleRecurringPaid(r) {
    const existing = txThisMonth.find((t) => t.recurringId === r.id);
    if (existing) {
      saveTx(transactions.filter((t) => t.id !== existing.id));
      if (r.debtId) saveDebts(debts.map((d) => (d.id === r.debtId ? { ...d, remaining: Math.min(d.principal, d.remaining + r.amount) } : d)));
    } else {
      saveTx([...transactions, { id: uid(), person: r.scope, kind: r.kind, amount: r.amount, category: r.category, date: todayISO(), note: `Récurrent : ${r.name}`, recurringId: r.id, debtId: r.debtId || undefined }]);
      if (r.debtId) saveDebts(debts.map((d) => (d.id === r.debtId ? { ...d, remaining: Math.max(0, d.remaining - r.amount) } : d)));
    }
  }
  function deleteItem(kind, id) {
    if (kind === "tx") saveTx(transactions.filter((t) => t.id !== id));
    if (kind === "budget") saveBudgets(budgets.filter((b) => b.id !== id));
    if (kind === "goal") saveGoals(goals.filter((g) => g.id !== id));
    if (kind === "recurring") saveRecurring(recurring.filter((r) => r.id !== id));
    if (kind === "placement") savePlacements(placements.filter((p) => p.id !== id));
    if (kind === "debt") saveDebts(debts.filter((d) => d.id !== id));
    if (kind === "patrimoine-project") {
      savePatrimoine(patrimoine.filter((p) => p.id !== id));
      savePatrimoineEntries(patrimoineEntries.filter((e) => e.projectId !== id));
    }
    if (kind === "patrimoine-entry") savePatrimoineEntries(patrimoineEntries.filter((e) => e.id !== id));
    setConfirmDeleteId(null);

              </div>

            <div style={{ flex: 1, textAlign: "left" }}>
              <p className="gl-sans" style={{ fontSize: 13.5, fontWeight: 600, color: C.ink, margin: 0 }}>Résumé annuel</p>
              <p className="gl-sans" style={{ fontSize: 11.5, color: C.muted, margin: "2px 0 0" }}>Revenus, charges, dépenses, épargne</p>

            <ChevronRight size={17} color={C.muted} />
          </button>

        <div style={{ margin: "0 20px 22px" }}>

                  <p className="gl-sans" style={{ fontSize: 11.5, color: C.muted, lineHeight: 1.5, margin: 0 }}>
                    Ce projet est entièrement saisi à la main, mois après mois — indépendant du reste de l'appli.
                  </p>
                </div>
              )}

              {/* --- patrimoine-entry --- */}
              {modal.type === "patrimoine-entry" && (
                <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                  <div>
                    <p className="gl-sans" style={{ fontSize: 12, color: C.muted, margin: "0 0 6px" }}>Mois</p>
                    <input type="month" value={draft.month} onChange={(e) => setDraft({ ...draft, month: e.target.value })}
                      className="gl-sans" style={{ padding: "10px 12px", borderRadius: 10, border: `1px solid ${C.border}`, background: C.card, fontSize: 13.5, color: C.ink }} />
                  </div>
                  <div>
                    <p className="gl-sans" style={{ fontSize: 12, color: C.muted, margin: "0 0 6px" }}>Solde {settings.person1}</p>
                    <input type="number" inputMode="decimal" placeholder="0,00" value={draft.person1} onChange={(e) => setDraft({ ...draft, person1: e.target.value })}
                      className="gl-serif" style={{ width: "100%", fontSize: 22, fontWeight: 600, color: C.person1, border: "none", background: "none", outline: "none" }} />
                  </div>
                  <div>
                    <p className="gl-sans" style={{ fontSize: 12, color: C.muted, margin: "0 0 6px" }}>Solde {settings.person2}</p>
                    <input type="number" inputMode="decimal" placeholder="0,00" value={draft.person2} onChange={(e) => setDraft({ ...draft, person2: e.target.value })}
                      className="gl-serif" style={{ width: "100%", fontSize: 22, fontWeight: 600, color: C.person2, border: "none", background: "none", outline: "none" }} />
                  </div>
                  <p className="gl-sans" style={{ fontSize: 11.5, color: C.muted, lineHeight: 1.5, margin: 0 }}>
                    Une saisie déjà existante pour ce mois sera remplacée par celle-ci.
                  </p>
                </div>
              )}

              {formError && (
                <p className="gl-sans" style={{ fontSize: 12.5, color: C.expense, background: "#A34C3618", border: `1px solid ${C.expense}`, borderRadius: 10, padding: "9px 12px", margin: "16px 0 0" }}>
                  {formError}
                </p>
              )}

              <button onClick={submitModal} className="gl-sans" style={{
                width: "100%", marginTop: 12, padding: "13px", borderRadius: 12, border: "none",
                background: C.ink, color: "#FBF9F3", fontSize: 14.5, fontWeight: 600,
              }}>
                {modal.type === "goal-add" && "Ajouter"}
                {modal.type === "placement-move" && (draft.direction === "verser" ? "Verser" : "Retirer")}
                {modal.type === "debt-pay" && "Rembourser"}
                {modal.type !== "goal-add" && modal.type !== "placement-move" && modal.type !== "debt-pay" && "Enregistrer"}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
